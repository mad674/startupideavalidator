version: '3.8'

services:
  mongo:
    image: mongo:6
    container_name: mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  postgres:
    image: postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: siv_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/startup_validator
      - REDIS_URL=redis://redis:6379
      - FASTAPI_URL=http://fastapi:8000
    ports:
      - "5000:5000"
    depends_on:
      - mongo
      - redis

  fastapi:
    build: ./fastapi
    container_name: fastapi
    restart: unless-stopped
    env_file:
      - ./fastapi/.env
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    depends_on:
      - backend

  frontend:
    image: node:18-alpine
    container_name: frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - ./frontend/.env
    environment:
      - REACT_APP_BACKEND=http://localhost:5000
      - REACT_APP_FASTAPI=http://localhost:8000
      - REACT_APP_CHATBOT=localhost:8000
    ports:
      - "3000:80"
    command: sh -c "npm ci && npm run build && npm install -g serve && serve -s build -l 80"
    depends_on:
      - backend
      - fastapi

volumes:
  mongo_data:
  redis_data:
  postgres_data: